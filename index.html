<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор цвета фона</title>
    <style>
                /* Базовые стили */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            transition: background-color 0.4s ease;
            overflow: hidden;
        }

        /* 1. СТАРТОВЫЙ АНИМИРОВАННЫЙ ГРАДИЕНТ */
        body.gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* КОНТЕЙНЕР ДЛЯ ТЕКСТА */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            transform: scale(1);
            z-index: 10;
        }

        .center-content.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        h1 {
            color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            user-select: none;
            margin-bottom: 10px;
            transition: color 0.4s ease;
            text-align: center;
            padding: 0 20px;
        }

        /* Отображение кода цвета */
        .color-code {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #555;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .color-code:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        /* Всплывающая подсказка "Скопировано!" */
        .copy-toast {
            position: fixed;
            top: 20px;
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 2. ИСТОРИЯ ЦВЕТОВ (БОКОВАЯ ПАНЕЛЬ) */
        .history-panel {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.5);
            padding: 15px 10px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(5px);
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* История скрывается вместе с центральным текстом */
        .history-panel.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .history-item {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .history-item:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* ЗОНА АКТИВАЦИИ НИЖНЕЙ ПАНЕЛИ */
        .hover-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 999;
        }

        /* Контейнер для кнопок */
        .color-picker-panel {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            gap: 15px;
            
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .hover-zone:hover .color-picker-panel {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Стили кнопок */
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .btn-white  { background-color: #ffffff; }
        .btn-red    { background-color: #ff4d4d; }
        .btn-green  { background-color: #2ecc71; }
        .btn-blue   { background-color: #3498db; }
        .btn-yellow { background-color: #f1c40f; }
        .btn-purple { background-color: #9b59b6; }

        /* Радужная кнопка */
        .btn-random {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% 200%;
            animation: rainbow 5s ease infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Подсказка про клавиши управления */
        .controls-hint {
            font-size: 0.8rem;
            margin-top: 15px;
            opacity: 0.6;
            text-align: center;
        }

        /* Стили для кнопки сброса */
        .btn-reset {
            background-color: #ffffff;
            color: #555555;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            user-select: none;
        }
        /* Эффект легкого поворота стрелки при наведении */
        .btn-reset:hover {
            transform: scale(1.15) rotate(-45deg);
        }

    </style>
</head>
<body>

        <!-- Центральный блок -->
    <div class="center-content" id="ui-center">
        <h1 id="main-title">Выберите цвет фона</h1>
        <div class="color-code" id="color-display" title="Нажмите, чтобы скопировать" onclick="copyToClipboard()">#FFFFFF</div>
        <div class="controls-hint">[Пробел] — случайный цвет | [< Стрелка влево] — назад</div>
    </div>

    <!-- Боковая панель истории -->
    <div class="history-panel" id="ui-history" title="История цветов">
        <!-- Сюда JavaScript будет добавлять кружочки последних цветов -->
    </div>

    <div class="copy-toast" id="toast">Код скопирован в буфер обмена!</div>

    <!-- Нижняя зона управления -->
    <div class="hover-zone" id="bottom-zone">
        <div class="color-picker-panel">
            <button class="color-btn btn-white" onclick="changeColor('#ffffff')"></button>
            <button class="color-btn btn-red" onclick="changeColor('#ff4d4d')"></button>
            <button class="color-btn btn-green" onclick="changeColor('#2ecc71')"></button>
            <button class="color-btn btn-blue" onclick="changeColor('#3498db')"></button>
            <button class="color-btn btn-yellow" onclick="changeColor('#f1c40f')"></button>
            <button class="color-btn btn-purple" onclick="changeColor('#9b59b6')"></button>
            <button class="color-btn btn-random" title="Случайный цвет" onclick="setRandomColor()"></button>
			<!-- Кнопка сброса памяти на стартовый градиент -->
<button class="color-btn btn-reset" title="Сбросить на градиент" onclick="resetToGradient()">&#8635;</button>
        </div>
		
    </div>




    <script>
               const title = document.getElementById('main-title');
        const colorDisplay = document.getElementById('color-display');
        const toast = document.getElementById('toast');
        const uiCenter = document.getElementById('ui-center');
        const uiHistory = document.getElementById('ui-history');
        const bottomZone = document.getElementById('bottom-zone');

        let fadeTimeout;
        let colorHistory = []; // Массив для хранения истории цветов
        const maxHistoryLength = 5; // Сколько цветов хранить в панели

        window.onload = function() {
            // Загружаем историю из памяти
            const savedHistory = localStorage.getItem('colorHistoryList');
            if (savedHistory) {
                colorHistory = JSON.parse(savedHistory);
                renderHistoryHTML();
            }

            const savedColor = localStorage.getItem('userBackgroundColor');
            if (savedColor && savedColor !== 'gradient') {
                changeColor(savedColor, false); // Применяем без повторного добавления в историю
            } else {
                // Если цвета нет — включаем анимированный стартовый градиент
                document.body.classList.add('gradient-bg');
                colorDisplay.innerText = "ГРАДИЕНТ";
                localStorage.setItem('userBackgroundColor', 'gradient');
                adjustElementsColor('#ffffff'); // Настраиваем текст под белый
            }
            startFadeTimer(); 
        };

        // Запуск 5-секундного таймера скрытия текста и истории
        function startFadeTimer() {
            clearTimeout(fadeTimeout);
            fadeTimeout = setTimeout(hideUI, 5000); 
        }

        function hideUI() {
            uiCenter.classList.add('hidden');
            uiHistory.classList.add('hidden'); // История прячется вместе с текстом
        }

        function showUI() {
            uiCenter.classList.remove('hidden');
            uiHistory.classList.remove('hidden');
        }

        // Показ по наведении на нижнюю зону
        bottomZone.addEventListener('mouseenter', () => {
            clearTimeout(fadeTimeout);
            showUI();
        });

        bottomZone.addEventListener('mouseleave', startFadeTimer);

        // УПРАВЛЕНИЕ С КЛАВИАТУРЫ
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); // Запрещаем прокрутку страницы пробелом
                setRandomColor();
            } else if (event.code === 'ArrowLeft') {
                returnToPreviousColor();
            }
        });

        // Главная функция изменения цвета
        function changeColor(color, addToHistory = true) {
            // Отключаем стартовый градиент, если он активен
            document.body.classList.remove('gradient-bg');
            const previousColor = localStorage.getItem('userBackgroundColor');

            // Добавляем в историю предыдущий цвет, если он корректный и отличается от нового
            if (addToHistory && previousColor && previousColor !== 'gradient' && previousColor !== color) {
                pushToHistory(previousColor);
            }

            document.body.style.backgroundColor = color;
            colorDisplay.innerText = color.toUpperCase();
            localStorage.setItem('userBackgroundColor', color);
            adjustElementsColor(color);
        }

        // Логика работы с массивом истории
        function pushToHistory(color) {
            // Удаляем цвет, если он уже есть в истории, чтобы избежать дубликатов
            colorHistory = colorHistory.filter(c => c !== color);
            // Добавляем в начало массива
            colorHistory.unshift(color);
            // Обрезаем до максимальной длины
            if (colorHistory.length > maxHistoryLength) {
                colorHistory.pop();
            }
            // Сохраняем в локальную память и обновляем экран
            localStorage.setItem('colorHistoryList', JSON.stringify(colorHistory));
            renderHistoryHTML();
        }

        // Функция возврата к предыдущему цвету (Стрелка влево)
        function returnToPreviousColor() {
            if (colorHistory.length > 0) {
                const lastColor = colorHistory.shift(); // Забираем цвет из истории
                localStorage.setItem('colorHistoryList', JSON.stringify(colorHistory));
                renderHistoryHTML();
                changeColor(lastColor, false); // Включаем его без повторной записи
            }
        }

        // Перерисовка кружочков истории на экране
        function renderHistoryHTML() {
            uiHistory.innerHTML = ''; // Очищаем панель
            colorHistory.forEach(color => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.style.backgroundColor = color;
                item.title = `Вернуть цвет ${color.toUpperCase()}`;
                item.onclick = () => changeColor(color, true); // При клике делаем цвет текущим
                uiHistory.appendChild(item);
            });
        }

        // Генератор случайного HEX-кода
        function setRandomColor() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            changeColor(randomColor);
        }

        // Настройка контрастности текста
        function adjustElementsColor(hexColor) {
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            
            if (yiq < 128) {
                title.style.color = '#ffffff';
                colorDisplay.style.color = '#ffffff';
                colorDisplay.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
            } else {
                title.style.color = '#333333';
                colorDisplay.style.color = '#555555';
                colorDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.6)';
            }
        }

        // Копирование в буфер обмена
        function copyToClipboard() {
            const textToCopy = colorDisplay.innerText;
            if (textToCopy === "ГРАДИЕНТ") return; // Не копируем слово "Градиент"
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }
        // Функция полного сброса памяти и возврата к градиенту
        function resetToGradient() {
            localStorage.clear(); // Полностью очищаем память сайта
            location.reload();    // Перезагружаем страницу для включения градиента
        }

</script>
</body>
</html>
